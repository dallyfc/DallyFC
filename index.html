<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dally FC</title>
<meta name="description" content="Real Madrid analysis and commentary from Dally FC.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5EF;
    --ink:#12203D;
    --gold:#B7922E;
    --line:#DCD7C8;
    --muted:#5B6472;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
  }

  main{
    width:100%;
    max-width:520px;
  }

  .crest{
    width:44px;
    height:44px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:2.4rem;
  }

  .crest span{
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(2.6rem,8vw,3.6rem);
    line-height:1.02;
    letter-spacing:-0.01em;
    margin:0 0 0.9rem;
  }

  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--gold);
  }

  p.tagline{
    font-size:1.05rem;
    color:var(--muted);
    line-height:1.55;
    max-width:34ch;
    margin:0 0 3rem;
  }

  .links{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid var(--line);
  }

  .links li{
    border-bottom:1px solid var(--line);
  }

  .links a{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1.5rem;
    padding:1.15rem 0.1rem;
    text-decoration:none;
    color:var(--ink);
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:500;
    transition:color .15s ease, padding-left .15s ease;
  }

  .links a:hover,
  .links a:focus-visible{
    color:var(--gold);
    padding-left:0.4rem;
  }

  .links a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:4px;
  }

  .links .handle{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:0.85rem;
    color:var(--muted);
    white-space:nowrap;
  }

  footer{
    margin-top:3rem;
    font-size:0.8rem;
    color:var(--muted);
  }

  @media (prefers-reduced-motion:reduce){
    .links a{transition:none;}
  }
</style>
</head>
<body>
<main>
  <div class="crest" aria-hidden="true"><span>D</span></div>

  <h1>Dally <em>FC</em></h1>
  <p class="tagline">Match analysis, transfer talk, and everything Real Madrid. Follow along wherever you scroll.</p>

  <ul class="links">
    <li><a href="https://www.youtube.com/@DallyFC" target="_blank" rel="noopener">YouTube <span class="handle">@DallyFC</span></a></li>
    <li><a href="https://x.com/Dally_FC" target="_blank" rel="noopener">X <span class="handle">@Dally_FC</span></a></li>
    <li><a href="https://www.tiktok.com/@dallyfc" target="_blank" rel="noopener">TikTok <span class="handle">@dallyfc</span></a></li>
    <li><a href="https://www.instagram.com/dallyfootballclub" target="_blank" rel="noopener">Instagram <span class="handle">@dallyfootballclub</span></a></li>
    <li><a href="https://www.facebook.com/DallyFootballClub" target="_blank" rel="noopener">Facebook <span class="handle">Dally Football Club</span></a></li>
  </ul>

  <footer>dallyfc.com</footer>
</main>
</body>
</html>
