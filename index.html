<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dally FC — Real Madrid, every week</title>
<meta name="description" content="Real Madrid news, analysis and match reactions from Dally FC.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1220;
    --navy-2:#111B2E;
    --paper:#F4F2EA;
    --gold:#C9A227;
    --gold-dim:#8A7327;
    --muted:#8B93A7;
    --line:rgba(244,242,234,0.14);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--navy);
    color:var(--paper);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:9vh 6vw 8vh;
  }

  header.hero{
    margin-bottom:3.2rem;
  }

  .kicker{
    font-size:0.78rem;
    color:var(--gold);
    letter-spacing:0.02em;
    margin:0 0 0.9rem;
    font-weight:500;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2.6rem,9vw,3.8rem);
    line-height:0.98;
    letter-spacing:-0.01em;
    margin:0 0 1rem;
  }

  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--gold);
  }

  p.lede{
    font-size:1.05rem;
    color:var(--muted);
    line-height:1.6;
    max-width:38ch;
    margin:0;
  }

  section.video{
    margin-bottom:3.4rem;
  }

  .video-label{
    display:flex;
    align-items:center;
    gap:0.55rem;
    font-size:0.85rem;
    color:var(--muted);
    margin-bottom:0.9rem;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.18);
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--navy-2);
  }

  .frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  .links{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid var(--line);
  }

  .links li{
    border-bottom:1px solid var(--line);
  }

  .links a{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1.5rem;
    padding:1.2rem 0.1rem;
    text-decoration:none;
    color:var(--paper);
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    font-weight:500;
    transition:color .15s ease, padding-left .15s ease;
  }

  .links a:hover,
  .links a:focus-visible{
    color:var(--gold);
    padding-left:0.4rem;
  }

  .links a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:4px;
  }

  .links .handle{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:0.85rem;
    color:var(--muted);
    white-space:nowrap;
  }

  footer{
    margin-top:3.2rem;
    font-size:0.8rem;
    color:var(--muted);
  }

  @media (prefers-reduced-motion:reduce){
    .links a{transition:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <p class="kicker">HALA MADRID</p>
    <h1>Dally <em>FC</em></h1>
    <p class="lede">Real Madrid news, transfer talk, and match reactions. New video below, always current.</p>
  </header>

  <section class="video">
    <div class="video-label"><span class="dot" aria-hidden="true"></span> Latest upload</div>
    <div class="frame">
      <iframe
        src="https://www.youtube.com/embed/videoseries?list=UUA30_xqANsak4Wijr3-hstA"
        title="Latest Dally FC video"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <ul class="links">
    <li><a href="https://www.youtube.com/@DallyFC" target="_blank" rel="noopener">YouTube <span class="handle">@DallyFC</span></a></li>
    <li><a href="https://x.com/Dally_FC" target="_blank" rel="noopener">X <span class="handle">@Dally_FC</span></a></li>
    <li><a href="https://www.tiktok.com/@dallyfc" target="_blank" rel="noopener">TikTok <span class="handle">@dallyfc</span></a></li>
    <li><a href="https://www.instagram.com/dallyfootballclub" target="_blank" rel="noopener">Instagram <span class="handle">@dallyfootballclub</span></a></li>
    <li><a href="https://www.facebook.com/DallyFootballClub" target="_blank" rel="noopener">Facebook <span class="handle">Dally Football Club</span></a></li>
  </ul>

  <footer>dallyfc.com</footer>

</div>
</body>
</html>
